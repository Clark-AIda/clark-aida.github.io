<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>부천이다 신청 링크</title>
<meta name="description" content="@bucheon.ida 인스타그램에 소개한 부천 생활정보의 신청·원문 링크">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root { --teal:#02343F; --cream:#F0EDCC; --peach:#F3A6A0; --soft:#9FC3C4; --ink:#0F2A30; --mute:#5B6270; --paper:#FAF8F2; }
* { box-sizing:border-box; margin:0; }
body { background:var(--cream); color:var(--ink); font-family:Pretendard,system-ui,sans-serif; word-break:keep-all; line-height:1.5; }
header { background:var(--teal); color:var(--cream); padding:28px 16px 24px; }
header .in, main { max-width:560px; margin:0 auto; }
header b { font-size:15px; color:var(--peach); }
header h1 { font-size:28px; line-height:1.25; margin-top:6px; }
header p { font-size:15px; color:var(--soft); margin-top:8px; }
main { padding:8px 16px 40px; }
h3 { font-size:16px; color:var(--teal); margin:24px 0 10px; }
article { background:#fff; border:2px solid var(--teal); border-radius:18px; padding:16px; margin-bottom:12px; }
.t { display:flex; gap:8px; align-items:center; }
.em { font-size:22px; }
h2 { font-size:19px; }
article p { font-size:15px; margin-top:6px; }
.how { color:var(--teal); font-weight:700; }
.due { display:inline-block; background:var(--peach); color:var(--teal); font-weight:800; font-size:13px; padding:2px 10px; border-radius:999px; }
.go { display:block; text-align:center; background:var(--teal); color:var(--cream); font-weight:800; font-size:16px;
       padding:13px; border-radius:12px; margin-top:12px; text-decoration:none; }
.go:focus-visible, .sub:focus-visible { outline:3px solid var(--peach); outline-offset:2px; }
.more { display:flex; gap:14px; margin-top:10px; }
.sub { font-size:14px; color:var(--mute); }
.none { margin-top:24px; }
footer { font-size:13px; color:var(--mute); margin-top:28px; }
footer a { color:var(--mute); }
@media (prefers-color-scheme: dark) {
  body { background:#0B2328; color:#E9E6C8; }
  article { background:#123840; border-color:var(--soft); }
  h3, .how { color:var(--soft); }
  .sub, footer, footer a { color:#B9C2C4; }
}
</style></head>
<body><header><div class="in"><b>@bucheon.ida</b><h1>부천 생활정보<br>신청 링크 모음</h1>
<p>인스타그램에 소개한 소식의 신청 페이지와 시청 원문이에요. 마감이 지난 소식은 자동으로 빠져요.</p></div></header>
<main><p class='none'>지금 신청할 수 있는 소식이 없어요. 매주 수요일에 새로 올라와요.</p>
<footer><p>출처: 부천시청 새소식 (공공누리 출처표시) · 일정은 바뀔 수 있으니 원문을 꼭 확인하세요.</p>
<p><a href="https://www.instagram.com/bucheon.ida/">인스타그램 @bucheon.ida</a> · 11월 24일 갱신</p></footer>
</main></body></html>
